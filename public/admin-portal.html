<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Superadmin Command Center | WaMart Enterprise</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode & Chart.js CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Inter & JetBrains Mono Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(51, 65, 85, 0.45); }
        #content-container { -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    </style>
</head>
<body class="h-[100dvh] max-h-[100dvh] bg-[#0b1120] text-slate-100 antialiased flex flex-col md:flex-row font-sans overflow-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Dynamic Responsive Sidebar & Mobile Top Bar Container -->
    <div id="sidebar-container" class="shrink-0 flex flex-col md:flex-row"></div>

    <!-- Main Right Column (Desktop Command Header + Scrollable Content Viewport) -->
    <div class="flex-1 flex flex-col min-w-0 min-h-0 overflow-hidden bg-[#0b1120]">
        <div id="admin-desktop-header-slot" class="shrink-0"></div>
        <main id="content-container" class="flex-1 min-h-0 p-3.5 sm:p-6 lg:p-7 overflow-y-auto overflow-x-hidden space-y-6 w-full"></main>
    </div>

    <!-- Mobile App Bottom Navigation Bar (< 768px) -->
    <div id="admin-mobile-bottom-nav" class="md:hidden shrink-0"></div>

    <!-- Core Vanilla JS Modular Admin Router (Cloudflare Pages Ready) -->
    <script type="module" src="/components/admin/admin-router.js"></script>
</body>
</html>
