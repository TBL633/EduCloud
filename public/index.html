<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaMart | WhatsApp Marketing & AI Automation Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter & JetBrains Mono Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Glowing Background Lighting -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="fixed bottom-10 right-10 w-[400px] h-[400px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Main Auth Card Container -->
    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 my-auto text-white">
        
        <!-- Brand Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-emerald-500/20 mb-3 border border-emerald-400/30 text-slate-950 font-black text-2xl">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <h1 className="text-2xl font-black tracking-tight text-white flex items-center justify-center gap-2">
                <span>WaMart</span>
                <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-bold uppercase tracking-wider">
                    AI SaaS
                </span>
            </h1>
            <p class="text-xs text-slate-400 mt-1 font-medium">WhatsApp Marketing & Automated Sales Gateway</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="auth-alert" class="hidden p-3.5 mb-5 rounded-2xl border text-xs font-semibold flex items-center gap-2.5 transition-all">
            <i id="auth-alert-icon" class="fa-solid"></i>
            <span id="auth-alert-msg" class="flex-1"></span>
        </div>

        <!-- Sign In / Sign Up Tab Switcher -->
        <div class="flex p-1 bg-slate-950 border border-slate-800 rounded-2xl mb-6">
            <button id="tab-btn-signin" onclick="switchAuthTab('signin')" class="flex-1 py-2 text-xs font-bold rounded-xl transition cursor-pointer bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                Sign In
            </button>
            <button id="tab-btn-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-xs font-bold rounded-xl transition cursor-pointer text-slate-400 hover:text-white">
                New Registration
            </button>
        </div>

        <!-- SIGN IN FORM -->
        <form id="form-signin" onsubmit="event.preventDefault(); handleLoginSubmit();" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Email Address or Username *</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                    <input type="text" id="login-identifier" placeholder="e.g. laxmi@wamart.ai or rkm632002" required class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-emerald-500 font-medium">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Password *</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                    <input type="password" id="login-password" placeholder="Enter your account password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-10 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-emerald-500 font-medium">
                    <button type="button" onclick="togglePasswordVisibility('login-password', 'toggle-pass-icon')" class="absolute right-3.5 top-3 text-slate-500 hover:text-slate-300">
                        <i id="toggle-pass-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-login-submit" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black rounded-2xl text-xs flex items-center justify-center gap-2 transition cursor-pointer shadow-lg shadow-emerald-500/20">
                <span>Sign In to Portal</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- SIGN UP / OTP FORM -->
        <form id="form-signup" onsubmit="event.preventDefault(); handleSignupStepSubmit();" class="hidden space-y-4">
            <!-- Step 1: User Credentials -->
            <div id="signup-step-credentials" class="space-y-3.5">
                <div>
                    <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Business Name / Full Name *</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                        <input type="text" id="reg-name" placeholder="e.g. Laxmi Kirana Store" required class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-emerald-500 font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Email Address *</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                        <input type="email" id="reg-email" placeholder="e.g. laxmi@wamart.ai" required class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-emerald-500 font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Password *</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                        <input type="password" id="reg-password" placeholder="Minimum 6 characters" minlength="6" required class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-emerald-500 font-medium">
                    </div>
                </div>

                <button type="submit" id="btn-signup-otp-request" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl text-xs flex items-center justify-center gap-2 transition cursor-pointer shadow-lg shadow-indigo-600/20">
                    <span>Send Verification Code (OTP)</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

            <!-- Step 2: Verification Code -->
            <div id="signup-step-otp" class="hidden space-y-3.5">
                <div class="text-center p-3 bg-indigo-950/60 border border-indigo-800/80 rounded-2xl space-y-1">
                    <p class="text-xs text-indigo-300">Enter the 6-digit OTP sent to <strong id="otp-target-email" class="text-white font-mono"></strong></p>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">6-Digit Verification Code *</label>
                    <input type="text" id="otp-code" placeholder="123456" maxlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-center text-lg font-mono font-bold text-emerald-400 outline-none focus:border-emerald-500 tracking-widest">
                </div>

                <div class="flex gap-2">
                    <button type="button" onclick="resetSignupStep()" class="py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs cursor-pointer">
                        Back
                    </button>
                    <button type="button" onclick="handleVerifyOtpSubmit()" id="btn-verify-otp" class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs flex items-center justify-center gap-2 transition cursor-pointer">
                        <span>Verify & Create Account</span>
                        <i class="fa-solid fa-check"></i>
                    </button>
                </div>
            </div>
        </form>

        <!-- Connection Footer Status -->
        <div class="mt-6 pt-4 border-t border-slate-800/80 text-center">
            <span class="text-[10px] text-slate-500 font-mono flex items-center justify-center gap-1.5" id="db-status-label">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>WaMart Neon Database Connected</span>
            </span>
        </div>
    </div>

    <!-- PURE JAVASCRIPT AUTH ENGINE -->
    <script>
        let currentAuthTab = 'signin';
        let currentSignupStep = 'credentials';

        function showAuthAlert(msg, isSuccess = false) {
            const box = document.getElementById('auth-alert');
            const icon = document.getElementById('auth-alert-icon');
            const msgEl = document.getElementById('auth-alert-msg');
            if (!box || !icon || !msgEl) return;

            msgEl.innerText = msg;
            box.className = `p-3.5 mb-5 rounded-2xl border text-xs font-semibold flex items-center gap-2.5 transition-all ${
                isSuccess 
                    ? 'bg-emerald-950/80 border-emerald-800 text-emerald-300' 
                    : 'bg-rose-950/80 border-rose-800 text-rose-300'
            }`;
            icon.className = `fa-solid ${isSuccess ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-rose-400'}`;
            box.classList.remove('hidden');
        }

        function switchAuthTab(tab) {
            currentAuthTab = tab;
            const btnSignin = document.getElementById('tab-btn-signin');
            const btnSignup = document.getElementById('tab-btn-signup');
            const formSignin = document.getElementById('form-signin');
            const formSignup = document.getElementById('form-signup');
            const alertBox = document.getElementById('auth-alert');

            if (alertBox) alertBox.classList.add('hidden');

            if (tab === 'signin') {
                btnSignin.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition cursor-pointer bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                btnSignup.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition cursor-pointer text-slate-400 hover:text-white';
                formSignin.classList.remove('hidden');
                formSignup.classList.add('hidden');
            } else {
                btnSignup.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition cursor-pointer bg-indigo-500/10 text-indigo-400 border border-indigo-500/20';
                btnSignin.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition cursor-pointer text-slate-400 hover:text-white';
                formSignin.classList.add('hidden');
                formSignup.classList.remove('hidden');
            }
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        async function handleLoginSubmit() {
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login-submit');

            if (!identifier || !password) {
                showAuthAlert('Please fill out all fields.');
                return;
            }

            if (btn) btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                const data = await res.json();
                if (res.ok && data.token) {
                    const userObj = data.user || {
                        username: data.username,
                        email: data.email,
                        account_name: data.account_name,
                        role: data.role,
                        user_type: data.user_type,
                        id: data.user_id
                    };
                    const userRole = userObj.role || userObj.user_type || (userObj.username === 'admin' ? 'admin' : 'user');

                    localStorage.setItem('wamart_token', data.token);
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('wamart_user', JSON.stringify(userObj));
                    localStorage.setItem('user_data', JSON.stringify(userObj));
                    localStorage.setItem('role', userRole);

                    showAuthAlert('Login successful! Redirecting...', true);

                    setTimeout(() => {
                        if (userRole === 'superadmin' || userRole === 'admin' || userObj.username === 'admin') {
                            window.location.href = '/admin-portal.html';
                        } else {
                            window.location.href = '/business-portal.html';
                        }
                    }, 500);
                } else {
                    showAuthAlert(data.message || data.error || 'Invalid credentials');
                }
            } catch (err) {
                showAuthAlert('Network error logging in. Please try again.');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        async function handleSignupStepSubmit() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const btn = document.getElementById('btn-signup-otp-request');

            if (!name || !email || !password) {
                showAuthAlert('Please complete all registration fields.');
                return;
            }

            if (btn) btn.disabled = true;

            try {
                const res = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, full_name: name, password })
                });

                const data = await res.json();
                if (res.ok) {
                    document.getElementById('otp-target-email').innerText = email;
                    document.getElementById('signup-step-credentials').classList.add('hidden');
                    document.getElementById('signup-step-otp').classList.remove('hidden');
                    showAuthAlert('Verification code sent to your email!', true);
                } else {
                    showAuthAlert(data.error || data.message || 'Failed to send OTP code');
                }
            } catch (err) {
                showAuthAlert('Network error sending verification code');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        function resetSignupStep() {
            document.getElementById('signup-step-otp').classList.add('hidden');
            document.getElementById('signup-step-credentials').classList.remove('hidden');
        }

        async function handleVerifyOtpSubmit() {
            const email = document.getElementById('otp-target-email').innerText;
            const code = document.getElementById('otp-code').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const password = document.getElementById('reg-password').value;
            const btn = document.getElementById('btn-verify-otp');

            if (!code || code.length < 4) {
                showAuthAlert('Please enter valid verification code.');
                return;
            }

            if (btn) btn.disabled = true;

            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp: code, full_name: name, password })
                });

                const data = await res.json();
                if (res.ok) {
                    if (data.token) {
                        const userObj = data.user || { username: email.split('@')[0], email, account_name: name };
                        localStorage.setItem('wamart_token', data.token);
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('wamart_user', JSON.stringify(userObj));
                        localStorage.setItem('user_data', JSON.stringify(userObj));
                        localStorage.setItem('role', 'user');
                    }
                    showAuthAlert('Account verified successfully! Redirecting...', true);
                    setTimeout(() => {
                        window.location.href = '/business-portal.html';
                    }, 800);
                } else {
                    showAuthAlert(data.error || data.message || 'Invalid or expired OTP');
                }
            } catch (err) {
                showAuthAlert('Verification failed. Network error.');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        // Auto check DB Status on mount
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/db-status')
                .then(r => r.json())
                .then(d => {
                    const label = document.getElementById('db-status-label');
                    if (label && d.connected) {
                        label.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span>Connected to ${d.engine || 'Neon Cloud DB'}</span>`;
                    }
                }).catch(() => {});
        });
    </script>
</body>
</html>
