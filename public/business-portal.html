<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Business Workspace | WaMart</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome, Cropper.js, Marked & Chart.js via CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        .glass-card { background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(16px); border: 1px solid rgba(51, 65, 85, 0.45); }
        #biz-main-scroll-container { -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    </style>
</head>
<body class="h-[100dvh] max-h-[100dvh] flex flex-col font-sans antialiased bg-[#0f172a] text-slate-100 overflow-hidden selection:bg-emerald-500 selection:text-black">

    <!-- Mobile Top Navigation Header Slot -->
    <div id="mobile-header-container" class="shrink-0"></div>

    <!-- Main Workspace Layout Wrapper (Desktop: Fixed Left Sidebar + Right Content | Mobile: Full-Bleed App View) -->
    <div class="flex-1 flex min-h-0 overflow-hidden relative">
        <!-- Dynamic Sidebar Container -->
        <div id="sidebar-container" class="shrink-0 flex"></div>

        <!-- Dynamic Main Content Container -->
        <main id="content-container" class="flex-1 flex flex-col min-w-0 min-h-0 bg-[#0f172a] overflow-hidden"></main>
    </div>

    <!-- Mobile App Bottom Navigation Bar Slot (< 768px) -->
    <div id="mobile-bottom-nav-container" class="md:hidden shrink-0"></div>

    <!-- Shared Modals Container (Image Cropper & Fullscreen Lightbox) -->
    <div id="shared-modals-container"></div>

    <!-- Core Vanilla JS Modular Router (Cloudflare Pages Ready) -->
    <script type="module" src="/components/shared/router.js"></script>
</body>
</html>
